<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Movies</title>
</head>
<body>
    <section id="landing">
        <!--NAV-->
        <nav> 
            <div class="logo">
                <img src="blgreen.png"/>
            </div>
            <ul class="links">
                <li>
                <a href="" class="link link__hover-effect">Home</a>
                </li>
                <li>
                <a href="#movies" class="link link__hover-effect select-first">Select A Movie</a>
                </li>
                <li>
                <a class="btn-contact">Contact Us</a>
                </li>
            </ul>
        </nav>
        <header class="header">
            <div class="container">
                <div class="row">
                    <h1>The Best Site To Find All Your Favorite Movies</h1>
                    <div class="search__wrapper">
                        <input class="search-input" type="text" placeholder="Search by Keyword, Year, or Title">
                        <button class="search__btn" type="button">
                            <img src="1486506270-glass-magnifying-out-search-detective-magnifier-zoom_81489 (1).svg">
                        </button>
                    </div>
                </div>
            </div>
        </header>
    </section>
    <div id="placeholder">
        <img src="theater.jpg" class="theater__img" alt="placeholder">
    </div>
    <section id="movies">
            <div class="container">
                <div class="row">
                   <p class="results"></p>
                    <div class="movie-list"></div>
                </div>
            </div>
    </section>
</body>
</html>
