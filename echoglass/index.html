<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ECHOGLASS" />
  <meta name="description" content="Something intelligent is trapped inside your phone." />
  <title>ECHOGLASS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="phone">
    <div id="bezel" aria-hidden="true"></div>
    <div id="glass" aria-hidden="true"></div>
    <canvas id="chamber" width="390" height="780"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="overlay">
      <p id="caption" class="caption"></p>
    </div>
    <button type="button" id="replay" class="hidden">REPLAY CHAMBER</button>
    <p id="desk-hint" class="desk-hint">Desktop: arrows/WASD tilt · click shockwave · hold field · drag gate</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
