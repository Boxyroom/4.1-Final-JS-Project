<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14241c" />
  <meta name="description" content="A simple two-player chess board — tap a piece, then tap a square." />
  <title>Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="shell">
    <header class="brand">
      <h1>Chess</h1>
      <p class="tagline">Two players · one board</p>
    </header>

    <section class="status" aria-live="polite">
      <p id="turn-label" class="turn">White to move</p>
      <p id="message" class="message"></p>
    </section>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Chess board"></div>
    </div>

    <div class="captured-row">
      <div id="captured-black" class="captured" aria-label="Captured black pieces"></div>
      <div id="captured-white" class="captured" aria-label="Captured white pieces"></div>
    </div>

    <div class="controls">
      <button type="button" id="btn-undo" class="btn ghost">Undo</button>
      <button type="button" id="btn-flip" class="btn ghost">Flip board</button>
      <button type="button" id="btn-new" class="btn primary">New game</button>
    </div>

    <dialog id="promote-dialog" class="promote-dialog">
      <form method="dialog" id="promote-form">
        <p>Promote pawn to</p>
        <div class="promote-choices">
          <button value="q" data-piece="q" aria-label="Queen">♛</button>
          <button value="r" data-piece="r" aria-label="Rook">♜</button>
          <button value="b" data-piece="b" aria-label="Bishop">♝</button>
          <button value="n" data-piece="n" aria-label="Knight">♞</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
